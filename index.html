<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Banebooking</title>
    <meta name="description" content="Banebooking – enkel booking av tennisbaner." />

    <meta name="theme-color" content="#0b3a4a" />
    <meta name="color-scheme" content="dark light" />

    <!-- Supabase connection warmup -->
    <link rel="preconnect" href="https://wfklkakrogxbhozxhtqd.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://wfklkakrogxbhozxhtqd.supabase.co" />

    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("vite-ui-theme");
          document.documentElement.classList.add(storedTheme === "dark" ? "dark" : "light");
        } catch {
          document.documentElement.classList.add("light");
        }
      })();
    </script>

    <style>
      html {
        height: 100%;
        background: #f2f3ed;
      }

      html.dark {
        background: #0f1611;
      }

      body {
        height: 100%;
        margin: 0;
        background: transparent;
      }

      /* Boot screen vises før React starter */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: inherit;
        color: #173c25;
        font-family: system-ui, sans-serif;
      }

      html.dark #boot {
        color: white;
      }

      .boot-loader {
        width: 36px;
        height: 36px;
        border: 3px solid rgb(23 60 37 / 0.18);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      html.dark .boot-loader {
        border-color: rgb(255 255 255 / 0.2);
        border-top-color: currentColor;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .boot-recovery {
        max-width: 28rem;
        padding: 1.5rem;
        text-align: center;
      }

      .boot-recovery h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }

      .boot-recovery p {
        margin: 0 0 1rem;
        color: currentColor;
        opacity: 0.78;
        line-height: 1.5;
      }

      .boot-recovery button {
        border: 1px solid rgb(23 60 37 / 0.25);
        border-radius: 0.5rem;
        padding: 0.65rem 1rem;
        background: #173c25;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      html.dark .boot-recovery button {
        border-color: rgb(255 255 255 / 0.35);
        background: white;
        color: #173c25;
      }
    </style>

    <script>
      (() => {
        const recoveryStorageKey = "banebooking:asset-recovery-at";
        const recoveryQueryParameter = "_app_reload";
        const recoveryCooldownMs = 60_000;
        const recoveryMessageDelayMs = 30_000;
        let recoveryStarted = false;

        async function reloadLatestVersion(button) {
          const url = new URL(window.location.href);
          url.searchParams.set(recoveryQueryParameter, Date.now().toString());

          if (button) {
            button.disabled = true;
            button.setAttribute("aria-busy", "true");
            button.textContent = "Laster nyeste versjon…";
          }

          try {
            const response = await fetch(url.toString(), {
              cache: "no-store",
              headers: { Accept: "text/html" },
            });
            if (!response.ok) {
              throw new Error(`Kunne ikke hente appen (${response.status}).`);
            }

            const html = await response.text();
            if (!html.includes('id="root"') || !html.includes('type="module"')) {
              throw new Error("Svaret inneholdt ikke Banebooking-appen.");
            }

            window.history.replaceState(
              window.history.state,
              "",
              `${url.pathname}${url.search}${url.hash}`
            );
            document.open();
            document.write(html);
            document.close();
          } catch {
            window.location.replace(url.toString());
          }
        }

        function canRecoverAutomatically() {
          const recoveryAtInUrl = Number(
            new URL(window.location.href).searchParams.get(recoveryQueryParameter) ?? "0"
          );
          if (Date.now() - recoveryAtInUrl < recoveryCooldownMs) {
            return false;
          }

          try {
            const lastRecoveryAt = Number(sessionStorage.getItem(recoveryStorageKey) ?? "0");
            if (Date.now() - lastRecoveryAt < recoveryCooldownMs) {
              return false;
            }

            sessionStorage.setItem(recoveryStorageKey, Date.now().toString());
            return true;
          } catch {
            return true;
          }
        }

        function showRecoveryMessage() {
          const boot = document.getElementById("boot");
          if (!boot || boot.querySelector(".boot-recovery")) {
            return;
          }

          const content = document.createElement("div");
          content.className = "boot-recovery";

          const title = document.createElement("h1");
          title.textContent = "Siden trenger en ny innlasting";

          const description = document.createElement("p");
          description.textContent =
            "En nyere versjon er tilgjengelig, eller oppstarten tok for lang tid.";

          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Last inn nyeste versjon";
          button.addEventListener("click", () => {
            try {
              sessionStorage.removeItem(recoveryStorageKey);
            } catch {
              // Safari kan blokkere nettleserlagring i enkelte moduser.
            }
            void reloadLatestVersion(button);
          });

          content.append(title, description, button);
          boot.replaceChildren(content);
        }

        function recoverFromAssetError() {
          if (recoveryStarted) {
            return;
          }
          recoveryStarted = true;

          if (canRecoverAutomatically()) {
            void reloadLatestVersion();
            return;
          }

          showRecoveryMessage();
        }

        // Vites anbefalte hendelse når en gammel klient ber om en utgått chunk.
        window.addEventListener("vite:preloadError", (event) => {
          event.preventDefault();
          recoverFromAssetError();
        });

        // Dekker også feil i selve inngangsmodulen før Vite-koden har startet.
        window.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            const failedModule = target instanceof HTMLScriptElement && target.type === "module";

            if (failedModule) {
              recoverFromAssetError();
            }
          },
          true
        );

        window.setTimeout(showRecoveryMessage, recoveryMessageDelayMs);
      })();
    </script>

    <link rel="icon" href="%BASE_URL%favicon.svg?v=3" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon.ico?v=3" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png?v=3" />
  </head>

  <body>
    <!-- Boot loader før React mount -->
    <div id="boot">
      <div class="boot-loader"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
