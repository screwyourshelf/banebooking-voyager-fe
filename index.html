<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Banebooking</title>
    <meta name="description" content="Banebooking – enkel booking av tennisbaner." />

    <meta name="theme-color" content="#0b3a4a" />
    <meta name="color-scheme" content="dark light" />

    <!-- Supabase connection warmup -->
    <link rel="preconnect" href="https://wfklkakrogxbhozxhtqd.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://wfklkakrogxbhozxhtqd.supabase.co" />

    <!-- Preload background image -->
    <link
      rel="preload"
      as="image"
      href="/backgrounds/bg-3.avif"
      type="image/avif"
      fetchpriority="high"
    />

    <style>
      html {
        height: 100%;
        background: #0b3a4a;
      }
      body {
        height: 100%;
        margin: 0;
        background: transparent;
      }

      /* Boot screen vises før React starter */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b3a4a;
        color: white;
        font-family: system-ui, sans-serif;
      }

      .boot-loader {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .boot-recovery {
        max-width: 28rem;
        padding: 1.5rem;
        text-align: center;
      }

      .boot-recovery h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }

      .boot-recovery p {
        margin: 0 0 1rem;
        color: rgba(255, 255, 255, 0.8);
        line-height: 1.5;
      }

      .boot-recovery button {
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 0.5rem;
        padding: 0.65rem 1rem;
        background: white;
        color: #0b3a4a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>

    <script>
      (() => {
        const recoveryStorageKey = "banebooking:asset-recovery-at";
        const recoveryQueryParameter = "_app_reload";
        const recoveryCooldownMs = 60_000;
        const recoveryMessageDelayMs = 30_000;
        let recoveryStarted = false;

        function reloadLatestVersion() {
          const url = new URL(window.location.href);
          url.searchParams.set(recoveryQueryParameter, Date.now().toString());
          window.location.replace(url);
        }

        function canRecoverAutomatically() {
          const recoveryAtInUrl = Number(
            new URL(window.location.href).searchParams.get(recoveryQueryParameter) ?? "0"
          );
          if (Date.now() - recoveryAtInUrl < recoveryCooldownMs) {
            return false;
          }

          try {
            const lastRecoveryAt = Number(sessionStorage.getItem(recoveryStorageKey) ?? "0");
            if (Date.now() - lastRecoveryAt < recoveryCooldownMs) {
              return false;
            }

            sessionStorage.setItem(recoveryStorageKey, Date.now().toString());
            return true;
          } catch {
            return true;
          }
        }

        function showRecoveryMessage() {
          const boot = document.getElementById("boot");
          if (!boot || boot.querySelector(".boot-recovery")) {
            return;
          }

          const content = document.createElement("div");
          content.className = "boot-recovery";

          const title = document.createElement("h1");
          title.textContent = "Siden trenger en ny innlasting";

          const description = document.createElement("p");
          description.textContent =
            "En nyere versjon er tilgjengelig, eller oppstarten tok for lang tid.";

          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Last inn nyeste versjon";
          button.addEventListener("click", () => {
            try {
              sessionStorage.removeItem(recoveryStorageKey);
            } catch {
              // Safari kan blokkere nettleserlagring i enkelte moduser.
            }
            reloadLatestVersion();
          });

          content.append(title, description, button);
          boot.replaceChildren(content);
        }

        function recoverFromAssetError() {
          if (recoveryStarted) {
            return;
          }
          recoveryStarted = true;

          if (canRecoverAutomatically()) {
            reloadLatestVersion();
            return;
          }

          showRecoveryMessage();
        }

        // Vites anbefalte hendelse når en gammel klient ber om en utgått chunk.
        window.addEventListener("vite:preloadError", (event) => {
          event.preventDefault();
          recoverFromAssetError();
        });

        // Dekker også feil i selve inngangsmodulen før Vite-koden har startet.
        window.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            const failedModule = target instanceof HTMLScriptElement && target.type === "module";

            if (failedModule) {
              recoverFromAssetError();
            }
          },
          true
        );

        window.setTimeout(showRecoveryMessage, recoveryMessageDelayMs);
      })();
    </script>

    <link rel="icon" href="%BASE_URL%favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon.ico?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png?v=2" />
  </head>

  <body>
    <!-- Boot loader før React mount -->
    <div id="boot">
      <div class="boot-loader"></div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
